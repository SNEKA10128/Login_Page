
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            background-color: #e6e6fa;
            font-family: Arial;
            text-align: center;
        }

        .login {
            background: white;
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: purple;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="login">
        <h2>Login Page</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <br>
        <button>Login</button>
    </div>

</body>
</html>
